# Seed Execution Order Configuration
# Seeds are executed in the order defined in this file.
# This ensures foreign key dependencies are satisfied.
#
# Format: seed_name_seed (without .sql extension)
# Seeds not listed here run afterwards, in alphabetical order.
#
# Geo is a strict hierarchy and each level carries a foreign key to the one
# above, so the order is the hierarchy itself. The generated default listed
# these alphabetically, which put cities before the provinces they reference.

- country_seed
- province_seed
- city_seed
- district_seed
- subdistrict_seed
